<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" class="fig" viewBox="0 0 1120 400" role="img" aria-label="Each action is defined once; the registry gives it to the palette, the context menus and the command line, the recording panel reads the file actions directly, and all four run over the same services."><style>.band{fill:#f2f5f7}.bl{font-size:11.5px;font-weight:600;letter-spacing:.02em;fill:#4a5a66}.bx{fill:#ffffff;stroke:#9aa9b4;stroke-width:1}.bx.core{fill:#e3f0ef;stroke:#0f6e69;stroke-width:1.6}.bx.warn{stroke:#b4650f;stroke-dasharray:5 3;stroke-width:1.4}.bx.ghost{fill:#f7f9fa}.t{font-size:13px;font-weight:600;fill:#16212b}.s{font-size:11.5px;fill:#4c5b67}.m{font-family:IBM Plex Mono, Consolas, Menlo, monospace;font-size:11px;fill:#24323d}.m.t{font-size:12.5px;font-weight:600;fill:#16212b}.e{fill:none;stroke:#6f808c;stroke-width:1.3}.e.warn{stroke:#b4650f;stroke-dasharray:5 3;stroke-width:1.5}.ah{fill:#6f808c}.ahw{fill:#b4650f}.el{font-size:11px;fill:#3e4d58;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bx" x="20" y="20" width="240" height="112" rx="5"/><text class="t" x="30" y="40">Action families</text><text class="s" x="30" y="60">8 families, one per kind of target</text><text class="s" x="30" y="76">session · file · transcript</text><text class="s" x="30" y="92">playback · position · folder</text><text class="s" x="30" y="108">search · help</text><rect class="bx" x="20" y="176" width="240" height="62" rx="5"/><text class="t" x="30" y="196">Recorder&#x27;s own commands</text><text class="m" x="30" y="216">status · record · stop</text><rect class="bx" x="20" y="300" width="240" height="62" rx="5"/><text class="t" x="30" y="320">File actions list</text><text class="m" x="30" y="340">FILE_ACTIONS</text><rect class="bx core" x="380" y="140" width="180" height="82" rx="5"/><text class="t" x="390" y="160">Action registry</text><text class="m" x="390" y="180">ActionRegistry</text><text class="s" x="390" y="196">one id check for all</text><rect class="bx" x="710" y="20" width="190" height="58" rx="5"/><text class="t" x="720" y="40">Command palette</text><text class="s" x="720" y="60">and hotkeys</text><rect class="bx" x="710" y="110" width="190" height="58" rx="5"/><text class="t" x="720" y="130">Context menus</text><text class="s" x="720" y="150">file · editor · player · folder</text><rect class="bx" x="710" y="200" width="190" height="58" rx="5"/><text class="t" x="720" y="220">Command line</text><text class="m" x="720" y="240">obsidian &lt;id&gt;:&lt;name&gt;</text><rect class="bx warn" x="710" y="302" width="190" height="58" rx="5"/><text class="t" x="720" y="322">Recording panel</text><text class="s" x="720" y="342">right sidebar, icon buttons</text><rect class="bx" x="990" y="20" width="110" height="340" rx="5"/><text class="t" x="1000" y="40">Services</text><text class="s" x="1000" y="60">conversion</text><text class="s" x="1000" y="76">split</text><text class="s" x="1000" y="92">transcription</text><text class="s" x="1000" y="108">sidecar</text><text class="s" x="1000" y="124">queue</text><path class="e" d="M260,76 L285,76 L285,160 L378,160" marker-end="url(#a)"/><text class="el" x="332" y="152" text-anchor="middle">add(family)</text><path class="e" d="M260,207 L285,207 L285,200 L378,200" marker-end="url(#a)"/><text class="el" x="332" y="192" text-anchor="middle">addCliCommands()</text><path class="e" d="M560,165 L610,165 L610,49 L708,49" marker-end="url(#a)"/><text class="el" x="659" y="41" text-anchor="middle">addCommand()</text><path class="e" d="M560,181 L630,181 L630,139 L708,139" marker-end="url(#a)"/><text class="el" x="669" y="131" text-anchor="middle">renderInto()</text><path class="e" d="M560,205 L590,205 L590,229 L708,229" marker-end="url(#a)"/><text class="el" x="649" y="221" text-anchor="middle">registerCliHandler()</text><path class="e warn" d="M260,331 L708,331" marker-end="url(#aw)"/><text class="el" x="484" y="323" text-anchor="middle">read directly, not through the registry</text><path class="e" d="M900,49 L988,49" marker-end="url(#a)"/><text class="el" x="944" y="41" text-anchor="middle">run()</text><path class="e" d="M900,139 L988,139" marker-end="url(#a)"/><text class="el" x="944" y="131" text-anchor="middle">run()</text><path class="e" d="M900,229 L988,229" marker-end="url(#a)"/><text class="el" x="944" y="221" text-anchor="middle">execute()</text><path class="e" d="M900,331 L988,331" marker-end="url(#a)"/><text class="el" x="944" y="323" text-anchor="middle">run()</text></svg>