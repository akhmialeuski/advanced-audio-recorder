<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" class="fig" viewBox="0 0 1000 440" role="img" aria-label="Each surface finds its target its own way and records how it reached a recording, and all four pass the same availability check and run the same action."><style>.band{fill:#f2f5f7}.bl{font-size:11.5px;font-weight:600;letter-spacing:.02em;fill:#4a5a66}.bx{fill:#ffffff;stroke:#9aa9b4;stroke-width:1}.bx.core{fill:#e3f0ef;stroke:#0f6e69;stroke-width:1.6}.bx.warn{stroke:#b4650f;stroke-dasharray:5 3;stroke-width:1.4}.bx.ghost{fill:#f7f9fa}.t{font-size:13px;font-weight:600;fill:#16212b}.s{font-size:11.5px;fill:#4c5b67}.m{font-family:IBM Plex Mono, Consolas, Menlo, monospace;font-size:11px;fill:#24323d}.m.t{font-size:12.5px;font-weight:600;fill:#16212b}.e{fill:none;stroke:#6f808c;stroke-width:1.3}.e.warn{stroke:#b4650f;stroke-dasharray:5 3;stroke-width:1.5}.ah{fill:#6f808c}.ahw{fill:#b4650f}.el{font-size:11px;fill:#3e4d58;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="band" x="20" y="20" width="640" height="96" rx="6"/><text class="t" x="34" y="73">Command palette</text><rect class="bx ghost" x="180" y="30" width="190" height="76" rx="5"/><text class="t" x="190" y="50">Trigger</text><text class="s" x="190" y="70">Palette opens,</text><text class="s" x="190" y="86">every command checked</text><rect class="bx" x="400" y="30" width="248" height="76" rx="5"/><text class="t" x="410" y="50">Target from</text><text class="s" x="410" y="70">Open file, cursor link, note links</text><text class="s" x="410" y="86">Folders: settings alone</text><text class="s" x="410" y="102">Several: picker first</text><path class="e" d="M370,68 L398,68" marker-end="url(#a)"/><path class="e" d="M648,68 L690,68 L690,214 L716,214" marker-end="url(#a)"/><rect class="band" x="20" y="128" width="640" height="82" rx="6"/><text class="t" x="34" y="174">Context menu</text><rect class="bx ghost" x="180" y="138" width="190" height="62" rx="5"/><text class="t" x="190" y="158">Trigger</text><text class="s" x="190" y="178">Right-click a file,</text><text class="s" x="190" y="194">a link or a player</text><rect class="bx" x="400" y="138" width="248" height="62" rx="5"/><text class="t" x="410" y="158">Target from</text><text class="s" x="410" y="178">Where it opened: note, link, moment,</text><text class="s" x="410" y="194">merged from the file and editor menus</text><path class="e" d="M370,169 L398,169" marker-end="url(#a)"/><path class="e" d="M648,169 L690,169 L690,214 L716,214" marker-end="url(#a)"/><rect class="band" x="20" y="222" width="640" height="82" rx="6"/><text class="t" x="34" y="268">Command line</text><rect class="bx ghost" x="180" y="232" width="190" height="62" rx="5"/><text class="t" x="190" y="252">Trigger</text><text class="s" x="190" y="272">A typed command</text><rect class="bx" x="400" y="232" width="248" height="62" rx="5"/><text class="t" x="410" y="252">Target from</text><text class="m" x="410" y="272">file= path= note=</text><text class="m" x="410" y="288">recording= all</text><path class="e" d="M370,263 L398,263" marker-end="url(#a)"/><path class="e" d="M648,263 L690,263 L690,214 L716,214" marker-end="url(#a)"/><rect class="band" x="20" y="316" width="640" height="82" rx="6"/><text class="t" x="34" y="362">Recording panel</text><rect class="bx ghost" x="180" y="326" width="190" height="62" rx="5"/><text class="t" x="190" y="346">Trigger</text><text class="s" x="190" y="366">A toolbar button</text><rect class="bx" x="400" y="326" width="248" height="62" rx="5"/><text class="t" x="410" y="346">Target from</text><text class="s" x="410" y="366">The recording it shows, beside</text><text class="s" x="410" y="382">the note, with the failed parts read</text><path class="e" d="M370,357 L398,357" marker-end="url(#a)"/><path class="e" d="M648,357 L690,357 L690,214 L716,214" marker-end="url(#a)"/><polygon class="bx core" points="790,164 864,214 790,264 716,214"/><text class="t" x="790" y="210" text-anchor="middle">Available?</text><text class="m" x="790" y="226" text-anchor="middle">isAvailable()</text><rect class="bx core" x="870" y="72" width="124" height="74" rx="5"/><text class="t" x="880" y="92">Run</text><text class="m" x="880" y="112">run()</text><text class="m" x="880" y="128">cli.execute()</text><rect class="bx" x="870" y="286" width="124" height="116" rx="5"/><text class="t" x="880" y="306">Left out</text><text class="s" x="880" y="326">palette: hidden</text><text class="s" x="880" y="342">menu: no entry</text><text class="s" x="880" y="358">panel: no button</text><text class="s" x="880" y="374">CLI: the reason</text><path class="e" d="M790,164 L790,109 L868,109" marker-end="url(#a)"/><text class="el" x="834" y="101" text-anchor="middle">yes</text><path class="e" d="M790,264 L790,344 L868,344" marker-end="url(#a)"/><text class="el" x="834" y="336" text-anchor="middle">no</text></svg>