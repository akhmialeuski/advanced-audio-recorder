xt><text class="m" x="568" y="708">cliNumber(), cliTime()</text><rect class="bx" x="736" y="652" width="166" height="86" rx="5"/><text class="m t" x="746" y="672">refusal.ts</text><text class="m" x="746" y="692">Refusable, isRefusal()</text><text class="m" x="746" y="708">valueOrThrow()</text><text class="s" x="746" y="724">a value or why not</text><rect class="bx" x="914" y="652" width="166" height="86" rx="5"/><text class="m t" x="924" y="672">notify.ts</text><text class="m" x="924" y="692">collectingNotify()</text><text class="s" x="924" y="708">notices into the answer</text></svg>