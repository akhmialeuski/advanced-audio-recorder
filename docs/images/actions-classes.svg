text class="m" x="34" y="108">offeredWithoutTargets?(action)</text><text class="m" x="34" y="124">cliTarget: CliTarget</text><text class="m" x="34" y="140">describe(context)</text><rect class="bx" x="320" y="36" width="238" height="128" rx="5"/><text class="m t" x="330" y="56">PluginCommand&lt;TContext&gt;</text><text class="m" x="330" y="76">commandId, title, icon</text><text class="m" x="330" y="92">menuTitle?</text><text class="m" x="330" y="108">isAvailable(context)</text><text class="m" x="330" y="124">run(context)</text><text class="m" x="330" y="140">cli: ActionCli</text><rect class="bx" x="592" y="36" width="222" height="128" rx="5"/><text class="m t" x="602" y="56">ActionCli&lt;TContext&gt;</text><text class="m" x="602" y="76">name, description</text><text class="m" x="602" y="92">params?, opensDialog?</text><text class="m" x="602" y="108">unavailable?(context)</text><text class="m" x="602" y="124">execute(context, args)</text><rect class="bx" x="848" y="36" width="228" height="128" rx="5"/><text class="m t" x="858" y="56">actionServices.ts</text><text class="m" x="858" y="76">ActionServices</text><text class="m" x="858" y="92">TranscriptionQueuePort</text><text class="m" x="858" y="108">QueueStatusView</text><text class="m" x="858" y="124">EnhancementPrimer</text><text class="s" x="858" y="140">shared by four families</text><path class="e" d="M286,70 L318,70" marker-end="url(#a)"/><text class="el" x="302" y="62" text-anchor="middle">actions</text><path class="e" d="M558,150 L590,150" marker-end="url(#a)"/><text class="el" x="574" y="142" text-anchor="middle">cli</text><rect class="band" x="10" y="192" width="1080" height="92" rx="6"/><text class="bl" x="1078" y="210" text-anchor="end">Families · src/actions/&lt;family&gt;/, each with its actions, its context and its ports</text><rect class="bx" x="24" y="220" width="123" height="48" rx="5"/><text class="m t" x="36" y="249">session</text><rect class="bx" x="157" y="220" width="123" height="48" rx="5"/><text