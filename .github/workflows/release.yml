name: Release Plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          # Same Node.js line the CI verify job tests on. No dependency cache:
          # a tag build signs and publishes its output, so it installs from the
          # lockfile alone rather than restoring a cache other runs could write.
          # setup-node turns that cache on by itself when package.json names
          # npm under devEngines.packageManager, so it is switched off here.
          node-version: "22"
          package-manager-cache: false

      # The npm bundled with Node 22 (10.x) ignores the nested madge override
      # in package.json and rejects the lock file as out of sync. The version
      # matches devEngines.packageManager in package.json.
      - name: Use the npm the lock file is written with
        run: npm install -g npm@11.6.4

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/main.js
            dist/styles.css

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}