name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type-check and build
              run: npm run build

            - name: Lint
              run: npm run lint

            - name: Tests with coverage thresholds
              run: npm run test:coverage -- --randomize

            - name: Coverage and suite-size regression guard
              run: node scripts/coverage-diff.mjs
