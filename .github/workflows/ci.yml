name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type-check and build
              run: npm run build

            - name: Lint
              run: npm run lint

            - name: Tests with coverage thresholds
              run: npm run test:coverage
