name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            # The npm bundled with Node 22 (10.x) ignores the nested madge
            # override in package.json and rejects the lock file as out of sync.
            # The version matches devEngines.packageManager in package.json,
            # which only warns, because setup-node asks npm 10 for its cache
            # directory before this step and an error there fails the job.
            - name: Use the npm the lock file is written with
              run: npm install -g npm@11.6.4

            - name: Install dependencies
              run: npm ci

            - name: Type-check and build
              run: npm run build

            - name: Lint
              run: npm run lint

            # madge counts `import type` edges, which ESLint import/no-cycle skips.
            # package.json overrides its typescript peer (^5.4.4) with the project's
            # 6.x until https://github.com/pahen/madge/issues/462 is fixed.
            - name: No import cycles in src
              run: npm run lint:cycles

            - name: Tests with coverage thresholds
              run: npm run test:coverage -- --randomize

            - name: Coverage and suite-size regression guard
              run: node scripts/coverage-diff.mjs

            - name: Test layers match what each test covers
              run: node scripts/layer-check.mjs

            - name: Test conventions stay within their ceilings
              run: node scripts/test-conventions.mjs

            - name: Test duplication stays within its ceiling
              run: node scripts/clone-check.mjs
